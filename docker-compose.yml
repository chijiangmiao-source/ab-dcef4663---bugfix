name: lock-audit

# One-shot verification (build image, run lock-rule tests, HTTP smoke):
#   docker compose up --build --exit-code-from verify verify
# (or simply ./verify.sh, which also tears the stack down afterwards)
#
# Standalone service:
#   docker compose up --build audit

services:
  audit:
    build: .
    image: lock-audit:local
    environment:
      PORT: "8080"
      # AUDIT_STORE_FILE: /data/audits.json   # optional verdict persistence
    ports:
      - "${HOST_PORT:-8080}:8080"

  verify:
    build: .
    image: lock-audit:local
    depends_on:
      audit:
        condition: service_healthy
    environment:
      AUDIT_URL: "http://audit:8080"
    command: ["python", "-m", "verify.run"]
